name: Base Image Update

on:
  schedule:
    # Weekly: every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version matches'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ${{ github.repository_owner }}/torrentfs-base

jobs:
  check-and-build:
    name: Check libtorrent version and rebuild if needed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Get latest libtorrent release tag
        id: libtorrent-version
        run: |
          LATEST_TAG=$(git ls-remote --tags --sort=-version:refname \
            https://github.com/arvidn/libtorrent.git 'v2.*' \
            | grep -oP 'refs/tags/\Kv[0-9.]+$' | head -n1)
          echo "Latest libtorrent release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Get current base image libtorrent version
        id: current-version
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          CURRENT_TAG=$(docker run --rm "$REGISTRY/$BASE_IMAGE:latest" cat /libtorrent-version 2>/dev/null || echo "none")
          echo "Current base image libtorrent version: $CURRENT_TAG"
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Determine if rebuild is needed
        id: should-rebuild
        env:
          LATEST: ${{ steps.libtorrent-version.outputs.tag }}
          CURRENT: ${{ steps.current-version.outputs.tag || 'none' }}
        run: |
          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"

          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST" = "$CURRENT" ]; then
            echo "Version matches ($LATEST). No rebuild needed."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed: $CURRENT → $LATEST. Rebuild needed."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.should-rebuild.outputs.rebuild == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.should-rebuild.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.should-rebuild.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        id: build-push
        if: steps.should-rebuild.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}:${{ steps.libtorrent-version.outputs.tag }}
          labels: |
            org.libtorrent.version=${{ steps.libtorrent-version.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report result
        if: always()
        env:
          REBUILD: ${{ steps.should-rebuild.outputs.rebuild }}
          LATEST: ${{ steps.libtorrent-version.outputs.tag }}
          CURRENT: ${{ steps.current-version.outputs.tag || 'none' }}
          OUTCOME: ${{ steps.build-push.outcome }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          if [ "$REBUILD" = "true" ]; then
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ Base image rebuilt: $CURRENT → $LATEST"
              echo "Image: $REGISTRY/$BASE_IMAGE:latest"
              echo "Digest: $DIGEST"
            else
              echo "❌ Base image rebuild failed (outcome: $OUTCOME)"
              echo "Target: $CURRENT → $LATEST"
            fi
          elif [ "$REBUILD" = "false" ]; then
            echo "⏭️  Skipped: libtorrent $LATEST already matches base image"
          else
            echo "⚠️  Unable to determine rebuild status. Check workflow logs."
          fi
